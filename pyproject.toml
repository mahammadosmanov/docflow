[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow"
version = "0.6.0"
description = "Safe desktop document automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyMuPDF==1.28.2",
  "numpy==2.5.2",
  "opencv-python-headless==5.0.0.93",
  "pytesseract==0.3.13",
  "openpyxl==3.1.5",
  "et_xmlfile==2.0.0",
  "packaging==26.3",
  "pillow==12.3.0",
]

[project.scripts]
docflow-sidecar = "docflow.sidecar:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"docflow.resources.l10n" = ["*.arb", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.12"
packages = ["docflow"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fitz.*", "pytesseract.*", "cv2.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docflow.ops.batch_print", "docflow.clipboard", "docflow.ops.rfi_log_add"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["docflow.xlsx_ooxml"]
disable_error_code = ["no-any-return"]
