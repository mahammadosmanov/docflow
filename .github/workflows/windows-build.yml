name: windows-build

# Windows test paketi uretir: Flutter UI + PyInstaller sidecar + Tesseract,
# tek zip. Cikti: Actions run -> Artifacts -> DocFlow-windows-x64.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Sidecar: PyInstaller ile tek klasor exe ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sidecar (PyInstaller)
        working-directory: sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --console --name docflow_sidecar `
            --collect-submodules docflow_sidecar `
            --collect-all fitz `
            --collect-all cv2 `
            run_sidecar.py
          if (-not (Test-Path "dist\docflow_sidecar\docflow_sidecar.exe")) {
            throw "sidecar exe uretilemedi"
          }

      # smoke: frozen sidecar JSON-RPC konusuyor mu?
      - name: Smoke-test frozen sidecar
        working-directory: sidecar
        shell: pwsh
        run: |
          $out = '{"id":1,"method":"list_operations","params":{}}' | .\dist\docflow_sidecar\docflow_sidecar.exe | Select-Object -First 1
          Write-Host "sidecar said: $out"
          if ($out -notmatch 'rfi.process_scans') { throw "frozen sidecar smoke basarisiz" }

      # ---- Tesseract binary'sini stage'le ----
      - name: Install + stage Tesseract
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $cands = @("C:\Program Files\Tesseract-OCR", "C:\Program Files (x86)\Tesseract-OCR")
          $src = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) { throw "Tesseract kurulum dizini bulunamadi" }
          Write-Host "tesseract src: $src"
          New-Item -ItemType Directory -Force -Path staging\tesseract | Out-Null
          Copy-Item "$src\*" staging\tesseract -Recurse -Force
          if (-not (Test-Path "staging\tesseract\tesseract.exe")) { throw "tesseract.exe stage edilemedi" }

      # ---- Flutter UI ----
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter (windows, release)
        working-directory: app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      # ---- Bundle: sidecar + tesseract'i app exe yanina koy, zip'le ----
      - name: Assemble bundle
        shell: pwsh
        run: |
          $rel = "app\build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\docflow.exe")) { throw "Flutter exe bulunamadi: $rel" }
          New-Item -ItemType Directory -Force -Path "$rel\sidecar" | Out-Null
          Copy-Item "sidecar\dist\docflow_sidecar\*" "$rel\sidecar" -Recurse -Force
          Copy-Item "staging\tesseract" "$rel\tesseract" -Recurse -Force
          # dogrulama: beklenen yollar
          if (-not (Test-Path "$rel\sidecar\docflow_sidecar.exe")) { throw "sidecar bundle eksik" }
          if (-not (Test-Path "$rel\tesseract\tesseract.exe")) { throw "tesseract bundle eksik" }
          Compress-Archive -Path "$rel\*" -DestinationPath "DocFlow-windows-x64.zip" -Force
          Write-Host "zip boyutu:" (Get-Item DocFlow-windows-x64.zip).Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-windows-x64
          path: DocFlow-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
