name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCFLOW_PYTHON_VERSION: "3.12.10"
  DOCFLOW_FLUTTER_VERSION: "3.44.8"
  DOCFLOW_TESSERACT_VERSION: "5.5.0.20241111"

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-2022
    timeout-minutes: 55

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DOCFLOW_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            sidecar/requirements.txt
            sidecar/requirements-dev.txt

      - name: Install pinned Tesseract
        shell: pwsh
        run: |
          choco install tesseract `
            --version="$env:DOCFLOW_TESSERACT_VERSION" `
            --allow-downgrade `
            --force `
            --no-progress `
            --yes
          $roots = @(
            "C:\Program Files\Tesseract-OCR",
            "C:\Program Files (x86)\Tesseract-OCR",
            (Join-Path $env:LOCALAPPDATA "Programs\Tesseract-OCR")
          )
          $root = $roots |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ "tesseract.exe") -PathType Leaf } |
            Select-Object -First 1
          if (-not $root) {
            throw "Pinned Tesseract installation was not found"
          }
          $exe = Join-Path $root "tesseract.exe"
          $tessdata = Join-Path $root "tessdata"
          if (-not (Test-Path -LiteralPath (Join-Path $tessdata "eng.traineddata") -PathType Leaf)) {
            throw "English Tesseract language data is missing"
          }
          "DOCFLOW_TESSERACT=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DOCFLOW_TESSERACT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TESSDATA_PREFIX=$tessdata" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned sidecar dependencies
        working-directory: sidecar
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip check

      - name: Test sidecar and real OCR
        working-directory: sidecar
        env:
          DOCFLOW_RUN_OCR_INTEGRATION: "1"
        run: |
          python -m mypy --config-file mypy.ini docflow_sidecar
          python -m pytest tests -q

      - name: Package sidecar
        working-directory: sidecar
        run: python -m PyInstaller --noconfirm --clean docflow_sidecar.spec

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.DOCFLOW_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze and test Flutter
        working-directory: app
        run: |
          dart analyze
          flutter test

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Bundle native runtimes
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "app\build\windows\x64\runner\Release"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) {
            throw "Visual Studio installation was not found"
          }
          $crt = Get-ChildItem -Path (Join-Path $vsRoot "VC\Redist\MSVC") -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Container } |
            Select-Object -First 1
          if (-not $crt) {
            throw "Visual C++ x64 runtime directory was not found"
          }
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item -LiteralPath (Join-Path $crt $dll) -Destination $release -Force
          }

          $tesseractDestination = Join-Path $release "tesseract"
          New-Item -ItemType Directory -Path $tesseractDestination -Force | Out-Null
          Copy-Item -Path (Join-Path $env:DOCFLOW_TESSERACT_ROOT "*") `
            -Destination $tesseractDestination -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $tesseractDestination "tesseract.exe") -PathType Leaf)) {
            throw "Bundled Tesseract executable is missing"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $tesseractDestination "tessdata\eng.traineddata") -PathType Leaf)) {
            throw "Bundled Tesseract English language data is missing"
          }

      - name: Smoke-test complete packaged application
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "app\build\windows\x64\runner\Release"
          $sidecar = Join-Path $release "sidecar\docflow_sidecar.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Packaged sidecar is missing from the release"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $release "docflow.exe") -PathType Leaf)) {
            throw "Flutter executable is missing from the release"
          }

          $pingLine = '{"id":1,"method":"ping","params":{}}' | & $sidecar | Select-Object -Last 1
          $ping = $pingLine | ConvertFrom-Json
          if ($ping.result.ok -ne $true) {
            throw "Packaged sidecar ping failed"
          }
          $versionLine = Select-String `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "app\pubspec.yaml") `
            -Pattern '^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$'
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          if ($ping.result.version -ne $appVersion) {
            throw "App/sidecar version mismatch: $appVersion / $($ping.result.version)"
          }

          $operationsLine = '{"id":2,"method":"list_operations","params":{}}' |
            & $sidecar |
            Select-Object -Last 1
          $operations = $operationsLine | ConvertFrom-Json
          $ids = @($operations.result | ForEach-Object { $_.id })
          foreach ($expected in @("rfi.process_scans", "rfi.log_add", "files.batch_print")) {
            if ($expected -notin $ids) {
              throw "Packaged sidecar is missing operation: $expected"
            }
          }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP "docflow-packaged-ocr"
          $source = Join-Path $fixtureRoot "source"
          $destination = Join-Path $fixtureRoot "destination"
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          $fixture = Join-Path $source "scan.pdf"
          python (Join-Path $env:GITHUB_WORKSPACE "sidecar\tests\ocr_fixture.py") $fixture

          $env:DOCFLOW_TESSERACT = Join-Path $release "tesseract\tesseract.exe"
          $env:TESSDATA_PREFIX = Join-Path $release "tesseract\tessdata"
          $request = @{
            id = 3
            method = "preview"
            params = @{
              op = "rfi.process_scans"
              params = @{
                source = $source
                dest = $destination
                keep_original = $true
              }
            }
          } | ConvertTo-Json -Depth 8 -Compress
          $previewLine = $request | & $sidecar | Select-Object -Last 1
          $preview = $previewLine | ConvertFrom-Json
          if ($preview.error) {
            throw "Packaged OCR preview failed: $($preview.error.message)"
          }
          if (@($preview.result.warnings).Count -ne 0) {
            throw "Packaged OCR preview returned warnings"
          }
          $codes = @($preview.result.steps | ForEach-Object { $_.meta.code } | Where-Object { $_ })
          if ("AZE-SUN-INT-QMS-RFI-CIV-0428" -notin $codes) {
            throw "Packaged OCR did not recognize the release fixture"
          }
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) {
            throw "Preview mutated the source fixture"
          }
          if (Test-Path -LiteralPath $destination) {
            throw "Preview created the destination directory"
          }

      - name: Write build manifest
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "app\build\windows\x64\runner\Release"
          $versionLine = Select-String `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "app\pubspec.yaml") `
            -Pattern '^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$'
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          $tesseractVersion = & (Join-Path $release "tesseract\tesseract.exe") --version |
            Select-Object -First 1
          $manifest = [ordered]@{
            gitCommit = $env:GITHUB_SHA
            appVersion = $appVersion
            builtAtUtc = [DateTime]::UtcNow.ToString("o")
            python = (python --version 2>&1)
            flutter = ((flutter --version --machine | ConvertFrom-Json).frameworkVersion)
            tesseract = $tesseractVersion
            dependencies = @(python -m pip freeze --all)
          }
          $manifest |
            ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $release "BUILD-MANIFEST.json") -Encoding utf8

      - name: Upload Windows package
        uses: actions/upload-artifact@v5
        with:
          name: DocFlow-Windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7

      - name: Upload lightweight UI component
        uses: actions/upload-artifact@v5
        with:
          name: DocFlow-Windows-UI-component
          path: |
            app/build/windows/x64/runner/Release/data/app.so
            app/build/windows/x64/runner/Release/BUILD-MANIFEST.json
          if-no-files-found: error
          retention-days: 7
