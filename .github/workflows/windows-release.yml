name: Windows Release

on:
  workflow_dispatch:
    inputs:
      draft_delivery_tag:
        description: "Unique unpublished draft tag to create for quota-independent installer delivery"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCFLOW_TESSERACT_VERSION: "5.5.0.20241111"
  DOCFLOW_TESSERACT_URL: "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe"
  DOCFLOW_TESSERACT_SHA256: "F3FC4236425B690C8BE756F35793F77394EE004BE0A6460A440C754D892F68BC"

jobs:
  build:
    name: Build and verify Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Install Tesseract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tesseractDirectory = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $tesseractExecutable = Join-Path $tesseractDirectory "tesseract.exe"
          $validChocolateyExitCodes = @(0, 1605, 1614, 1641, 3010)

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Installing Tesseract with Chocolatey (attempt $attempt of 3)..."
            & choco install tesseract `
              --version="$env:DOCFLOW_TESSERACT_VERSION" `
              --allow-downgrade `
              --no-progress `
              --yes
            $chocolateyExitCode = $LASTEXITCODE

            if (
              $validChocolateyExitCodes -contains $chocolateyExitCode -and
              (Test-Path -LiteralPath $tesseractExecutable -PathType Leaf)
            ) {
              break
            }

            if ($attempt -lt 3) {
              Write-Warning "Chocolatey failed with exit code $chocolateyExitCode; retrying."
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

          if (-not (Test-Path -LiteralPath $tesseractExecutable -PathType Leaf)) {
            Write-Warning "Chocolatey is unavailable; using the pinned official Tesseract release."
            $installer = Join-Path $env:RUNNER_TEMP "tesseract-$env:DOCFLOW_TESSERACT_VERSION.exe"
            Invoke-WebRequest `
              -Uri $env:DOCFLOW_TESSERACT_URL `
              -OutFile $installer `
              -MaximumRetryCount 3 `
              -RetryIntervalSec 10

            $downloadedHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($downloadedHash -ne $env:DOCFLOW_TESSERACT_SHA256) {
              throw "Tesseract installer checksum mismatch: $downloadedHash"
            }

            $installProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList "/S" `
              -Wait `
              -PassThru
            if ($installProcess.ExitCode -notin @(0, 3010)) {
              throw "Tesseract installer failed with exit code $($installProcess.ExitCode)."
            }
          }

          if (-not (Test-Path -LiteralPath $tesseractExecutable -PathType Leaf)) {
            throw "Tesseract installation completed without producing $tesseractExecutable."
          }

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $tesseractDirectory
          & $tesseractExecutable --version
          if ($LASTEXITCODE -ne 0) {
            throw "Tesseract executable verification failed with exit code $LASTEXITCODE."
          }

      - name: Test and build Windows installer
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Smoke-test clean NSIS install, startup, package, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "The NSIS installer was not produced."
          }
          ./tools/smoke_windows_installer.ps1 -Installer $installer.FullName

      - name: Record explicit manual certification gates
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ## Pending manual certification

          - Microsoft Office open/recalculate and Excel COM/clipboard
          - Microsoft Print to PDF plus representative physical/network printers
          - Signing and notarization credentials

          Automated Windows build/install/startup/OCR/package/uninstall evidence does not certify these gates.
          "@

      - name: Upload Windows installer
        id: artifact_upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: DocFlow-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Report unavailable branch artifact storage
        if: steps.artifact_upload.outcome == 'failure' && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Write-Warning "The installer passed every build gate, but GitHub artifact storage rejected it."
          Write-Warning "No unversioned release was created. Tag builds still publish through GitHub Releases."

      - name: Upload installer to requested unpublished draft
        if: github.event_name == 'workflow_dispatch' && inputs.draft_delivery_tag != ''
        shell: pwsh
        env:
          DRAFT_DELIVERY_TAG: ${{ inputs.draft_delivery_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releasePayload = @{
            tag_name = $env:DRAFT_DELIVERY_TAG
            target_commitish = $env:GITHUB_SHA
            name = "Temporary DocFlow Windows delivery"
            body = "Unpublished temporary delivery channel. Delete after local verification."
            draft = $true
            prerelease = $false
          } | ConvertTo-Json
          $release = $releasePayload |
            & gh api --method POST `
              "repos/$env:GITHUB_REPOSITORY/releases" `
              --input - |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release) {
            throw "Creating draft delivery release $env:DRAFT_DELIVERY_TAG failed."
          }
          if (-not $release.draft) {
            throw "GitHub created a published delivery release; refusing to upload assets."
          }
          if ($release.target_commitish -ne $env:GITHUB_SHA) {
            throw "Draft delivery release targets $($release.target_commitish), not $env:GITHUB_SHA."
          }

          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "The NSIS installer was not produced."
          }
          $checksum = Get-Item -LiteralPath "$($installer.FullName).sha256"

          $uploadHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          foreach ($asset in @($installer, $checksum)) {
            $assetName = [System.Uri]::EscapeDataString($asset.Name)
            $uploadUri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$assetName"
            $uploaded = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $uploaded = Invoke-RestMethod `
                  -Uri $uploadUri `
                  -Method Post `
                  -Headers $uploadHeaders `
                  -ContentType "application/octet-stream" `
                  -InFile $asset.FullName
                break
              }
              catch {
                if ($attempt -eq 3) {
                  throw
                }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if ($uploaded.name -ne $asset.Name -or $uploaded.size -ne $asset.Length) {
              throw "GitHub returned mismatched metadata for uploaded asset $($asset.Name)."
            }
          }

          $uploadedAssets = @(
            & gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets" |
              ConvertFrom-Json
          )
          foreach ($expected in @($installer, $checksum)) {
            $uploaded = $uploadedAssets | Where-Object { $_.name -eq $expected.Name }
            if (-not $uploaded -or $uploaded.size -ne $expected.Length) {
              throw "Draft delivery release has no exact uploaded asset $($expected.Name)."
            }
          }

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "The NSIS installer was not produced."
          }

          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $tag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $tag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }
          node tools/version_manager.mjs check --require-tag
          if ($LASTEXITCODE -ne 0) {
            throw "The version contract or release tag is invalid."
          }
          $notes = Join-Path $env:RUNNER_TEMP "docflow-$version-notes.md"
          node tools/version_manager.mjs notes $version | Out-File -FilePath $notes -Encoding utf8
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $env:RUNNER_TEMP "$($installer.Name).sha256"
          "$installerHash  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          $checksum = Get-Item -LiteralPath $checksumPath
          $releaseFlags = @()
          if ($version.Contains("-")) {
            $releaseFlags += "--prerelease"
          }

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to replace its assets."
          }

          & gh release create $tag $installer.FullName $checksum.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "DocFlow $version" `
            --notes-file $notes `
            @releaseFlags
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the Windows installer release failed."
          }
