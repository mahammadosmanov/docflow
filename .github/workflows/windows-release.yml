name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCFLOW_TESSERACT_VERSION: "5.5.0.20241111"

jobs:
  build:
    name: Build and verify Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tesseract
        shell: pwsh
        run: >-
          choco install tesseract
          --version="$env:DOCFLOW_TESSERACT_VERSION"
          --allow-downgrade
          --no-progress
          --yes

      - name: Test and build Windows installer
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Upload Windows installer
        id: artifact_upload
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: DocFlow-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer when artifact storage is unavailable
        if: steps.artifact_upload.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "The NSIS installer was not produced."
          }

          $tag = "v0.5.4-tauri-preview"
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag $installer.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            & gh release create $tag $installer.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "DocFlow 0.5.4 Tauri Windows Preview" `
              --notes "Verified Windows x64 preview built from the Tauri migration branch." `
              --prerelease
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the Windows installer release failed."
          }
