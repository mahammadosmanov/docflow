name: Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test Python, React, and Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          npm ci

      - name: Verify version and Python contracts
        run: |
          python tools/version_manager.py check
          python -m pytest
          python -m mypy src/docflow tools/version_manager.py tools/onedrive_stage_smoke.py

      - name: Verify the React interface
        run: |
          npm test
          npm run build

      - name: Verify the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          touch src-tauri/binaries/docflow-sidecar-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/docflow-sidecar-x86_64-unknown-linux-gnu
          cargo check --manifest-path src-tauri/Cargo.toml