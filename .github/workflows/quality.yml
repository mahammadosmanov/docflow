name: Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Version and documentation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify version contract, docs audit, and tool tests
        run: |
          node tools/version_manager.mjs check
          node tools/docs_audit.mjs
          node --test tools/version_manager.test.mjs tools/docs_audit.test.mjs

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install dependencies
        working-directory: flutter/app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter/app
        run: flutter analyze

      - name: Test
        working-directory: flutter/app
        run: flutter test
