version: 2
updates:
  - package-ecosystem: pip
    directory: /sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      flutter-runtime:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
