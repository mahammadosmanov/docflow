[package]
name = "docflow"
version = "0.6.0"
description = "Safe desktop document automation"
authors = ["DocFlow"]
edition = "2024"

[lib]
name = "docflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
