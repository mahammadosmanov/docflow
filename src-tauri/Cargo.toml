[package]
name = "docflow"
version = "1.36.109"
description = "Safe desktop document automation"
authors = ["DocFlow"]
edition = "2024"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.test]
incremental = false
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[lib]
name = "docflow_lib"
crate-type = ["rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.9"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
percent-encoding = "2"
png = "0.17"
quick-xml = "0.41"
rayon = "1.11"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
zeroize = "1"
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2"] }
unicode-casefold = "0.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Data_Pdf", "Foundation", "Storage", "Storage_Search", "Storage_Streams", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Printing", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
